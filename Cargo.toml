[package]
name = "zarc_py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "zarc"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zarc = { path = "./rust", version = "*" }
pyo3 = { version = "0.30.1", features = ["abi3", "extension-module", "multiple-pymethods"] }

[profile.release]
panic = 'abort'
lto = true

[workspace]
members = [
    "js",
    "rust",
]
